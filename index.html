<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文庫組版シミュレーター ─ CryStar Studio</title>
<meta name="description" content="Web小説の原稿をA6文庫本（縦組み・右綴じ）として組版し、PDFに保存できるブラウザツール">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="ui-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link id="book-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap">

<!-- ===== 自サイト公開用設定 =====
  mode を "reader" にすると編集パネルが消え、閲覧専用の電子書籍ビューアになります。
  設定値は編集モードの「設定を書き出し」で取得できます。 -->
<script id="book-config" type="application/json">
{ "mode": "editor" }
</script>
<!-- 原稿（reader モードで使用。空なら保存済み原稿 or サンプル） -->
<script id="manuscript" type="text/plain"></script>

<style>
:root{
  --desk:#e6e2d8; --desk-2:#d9d4c7; --ink:#20242c; --muted:#5f6470;
  --panel:#f7f5f0; --line:#c9c3b5; --accent:#2f4f7f; --accent-ink:#fff;
  --paper:#fcfaf4; --paper-ink:#1b1b1b; --shadow:rgba(40,30,10,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --desk:#23262d; --desk-2:#1b1d23; --ink:#e7e4dc; --muted:#a4a7b0;
  --panel:#2c3038; --line:#454a55; --accent:#8fb0e0; --accent-ink:#14171c; --shadow:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --desk:#23262d; --desk-2:#1b1d23; --ink:#e7e4dc; --muted:#a4a7b0;
  --panel:#2c3038; --line:#454a55; --accent:#8fb0e0; --accent-ink:#14171c; --shadow:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-size:14px;line-height:1.6}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 40px}
.side h1{font-size:17px;margin:0 0 2px;letter-spacing:.04em}
.side .sub{color:var(--muted);font-size:12px;margin:0 0 14px}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:700;font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--desk);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
textarea{min-height:260px;resize:vertical;font-family:"Noto Serif JP",serif;font-size:13px;line-height:1.7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.check{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:13px;margin:6px 0}
.hint{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--desk);color:var(--ink);padding:7px 12px;border-radius:4px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{font-size:12px;background:var(--desk);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-top:6px}
.stats b{font-size:15px}

.main{position:relative;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--desk) 0%,var(--desk-2) 100%)}
.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;flex-wrap:wrap}
.toolbar .pos{min-width:130px;text-align:center;font-size:13px;color:var(--muted)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;user-select:none}
.scaler{transform-origin:top left}
.spread{display:flex;flex-direction:row-reverse;box-shadow:0 12px 32px var(--shadow);position:relative}
.spread.single{box-shadow:0 10px 26px var(--shadow)}
.slot{width:105mm;height:148mm;position:relative}
.slot.empty{visibility:hidden}
.spread:not(.single) .slot:not(.empty):first-child::after{ /* 右ページのノド影 */
  content:"";position:absolute;inset:0 auto 0 0;width:9mm;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,0));pointer-events:none}
.spread:not(.single) .slot:not(.empty):last-child::after{
  content:"";position:absolute;inset:0 0 0 auto;width:9mm;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,0));pointer-events:none}
.tap{position:absolute;top:0;bottom:0;width:30%;z-index:3;cursor:pointer}
.tap.l{left:0}.tap.r{right:0}

/* ===== 紙面 ===== */
.page{width:105mm;height:148mm;background:var(--paper);color:var(--paper-ink);position:relative;overflow:hidden;
  font-family:var(--bf),serif;font-kerning:none}
.body{position:absolute;writing-mode:vertical-rl;text-orientation:mixed;
  line-break:strict;word-break:normal;overflow-wrap:anywhere;hanging-punctuation:allow-end;
  text-align:justify;text-justify:inter-character;overflow:hidden}
.body p{margin:0}
.body ruby rt{font-size:.5em;letter-spacing:0}
.body .tcy{text-combine-upright:all}
.body .bt{text-emphasis:filled sesame;-webkit-text-emphasis:filled sesame}
.body h2{margin:0;font-weight:700;font-size:1.35em}
.body .hsp{display:block}
.nombre{position:absolute;font-size:7pt;font-family:var(--bf),serif;letter-spacing:.05em}
.hashira{position:absolute;font-size:6.5pt;writing-mode:horizontal-tb;letter-spacing:.1em;color:#444}
.tobira,.okuduke,.cover{position:absolute;inset:0}
.tobira .t{position:absolute;writing-mode:vertical-rl;font-weight:700;letter-spacing:.2em}
.tobira .a{position:absolute;writing-mode:vertical-rl;letter-spacing:.2em}
.okuduke{writing-mode:horizontal-tb;font-size:7pt;line-height:1.8}
.okuduke .box{position:absolute;left:18mm;right:18mm;bottom:22mm;border-top:.3pt solid #333;border-bottom:.3pt solid #333;padding:4mm 0}
.okuduke .bt2{font-size:10pt;font-weight:700;margin-bottom:2mm}
.cover .t{position:absolute;right:12mm;top:14mm;writing-mode:vertical-rl;font-size:22pt;font-weight:700;letter-spacing:.12em;line-height:1.2}
.cover .a{position:absolute;left:10mm;bottom:12mm;writing-mode:vertical-rl;font-size:10pt;letter-spacing:.25em}
.cover .band{position:absolute;left:0;right:0;bottom:0;height:38mm;background:rgba(255,255,255,.9);color:#222;display:flex;align-items:center;justify-content:center;font-size:9pt;writing-mode:horizontal-tb;padding:0 8mm;text-align:center}
.cover .t,.cover .a,.tobira .t,.tobira .a{white-space:nowrap}
.imglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.imglist .it{position:relative;width:62px;font-size:10px;color:var(--muted);text-align:center;word-break:break-all}
.imglist img{width:62px;height:88px;object-fit:cover;border:1px solid var(--line);display:block}
.imglist button{position:absolute;top:2px;right:2px;padding:0 5px;font-size:11px;line-height:1.4}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.missing{position:absolute;inset:8mm;border:.4pt dashed #999;display:flex;align-items:center;justify-content:center;font-size:8pt;color:#888;writing-mode:horizontal-tb;text-align:center}
.cover.hasimg .t,.cover.hasimg .a{text-shadow:0 0 3mm rgba(0,0,0,.55)}
#measure{position:absolute;left:-9999px;top:0;visibility:hidden}
#print-root{display:none}

/* reader */
.reader .side{display:none}
.reader .app{grid-template-columns:1fr}
.reader .edit-only{display:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100%}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .main{height:100vh;height:100dvh}
}

@page{size:105mm 148mm;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  .app,#measure{display:none!important}
  #print-root{display:block}
  #print-root .page{page-break-after:always;break-after:page;background:#fff}
  #print-root .page:last-child{page-break-after:auto;break-after:auto}
  :root{padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>文庫組版シミュレーター</h1>
    <p class="sub">A6（105×148mm）・縦組み・右綴じ　<a href="https://github.com/crystar-studio/bunko-tools" style="color:inherit">使い方・ソースコード</a></p>

    <details open>
      <summary>原稿</summary>
      <label for="title">タイトル</label><input id="title" type="text">
      <div class="row">
        <div><label for="author">著者</label><input id="author" type="text"></div>
        <div><label for="label">レーベル名</label><input id="label" type="text"></div>
      </div>
      <label for="text">本文</label>
      <textarea id="text" spellcheck="false"></textarea>
      <p class="hint">タイトル中の「｜」で表紙・扉のタイトルを改行できます。<br>ルビ：｜漢字《かんじ》／漢字《かんじ》　傍点：《《強調》》<br>章見出し：行頭に「# 」　改ページ：［改ページ］<br>2桁数字と「!?」は自動で縦中横になります。</p>
    </details>

    <details open>
      <summary>版面</summary>
      <label for="preset">プリセット</label>
      <select id="preset">
        <option value="42,17">ライトノベル標準（42字×17行）</option>
        <option value="39,16">ライトノベルゆったり（39字×16行）</option>
        <option value="38,16">一般文庫（38字×16行）</option>
        <option value="40,17">一般文庫やや詰め（40字×17行）</option>
        <option value="custom">カスタム</option>
      </select>
      <div class="row">
        <div><label for="chars">字詰め（字／行）</label><input id="chars" type="number" min="20" max="50"></div>
        <div><label for="lines">行数（行／頁）</label><input id="lines" type="number" min="10" max="22"></div>
      </div>
      <label>余白 mm（天・地・ノド・小口）</label>
      <div class="row4">
        <input id="mTop" type="number" step="0.5" aria-label="天">
        <input id="mBottom" type="number" step="0.5" aria-label="地">
        <input id="mGutter" type="number" step="0.5" aria-label="ノド">
        <input id="mFore" type="number" step="0.5" aria-label="小口">
      </div>
      <p class="hint" id="spec"></p>
      <label for="font">本文書体</label>
      <select id="font">
        <option value="Noto Serif JP">源ノ明朝系（Noto Serif JP）</option>
        <option value="Shippori Mincho">しっぽり明朝</option>
        <option value="Zen Old Mincho">Zen Old Mincho</option>
        <option value="BIZ UDPMincho">BIZ UDP明朝</option>
        <option value="Klee One">クレー（手書き風）</option>
      </select>
    </details>

    <details open>
      <summary>画像</summary>
      <label for="imgFile">画像を追加（複数可・ファイル名が画像名になります）</label>
      <input id="imgFile" type="file" accept="image/*" multiple>
      <div id="imgList" class="imglist"></div>
      <p class="hint" id="imgNote"></p>
      <label for="coverImg">表紙イラスト</label>
      <select id="coverImg"></select>
      <label for="kuchie">口絵（カラーイラスト・扉の前）</label>
      <input id="kuchie" type="text" placeholder="例：kuchie1, kuchie2, kuchie3">
      <p class="hint">口絵は並べた順に、右→左の見開きで入ります。<br>本文の挿絵は、入れたい位置に<br>［挿絵：画像名］<br>の1行を置くと、1ページ挿絵になります（隠しノンブル）。</p>
    </details>

    <details>
      <summary>体裁</summary>
      <label class="check"><input type="checkbox" id="optCover" checked> 表紙を付ける</label>
      <div class="row">
        <div><label for="coverColor">表紙の色</label><input id="coverColor" type="text" value="#35507a"></div>
        <div><label for="coverOn">表紙文字色</label><input id="coverOn" type="text" value="#ffffff"></div>
      </div>
      <label class="check"><input type="checkbox" id="optCoverText" checked> 表紙にタイトル・著者名を載せる</label>
      <label class="check"><input type="checkbox" id="optBand" checked> 帯を付ける</label>
      <label for="coverBand">帯の文言</label><input id="coverBand" type="text">
      <label class="check"><input type="checkbox" id="optTobira" checked> 扉（タイトルページ）</label>
      <label for="quoteMode">"〜" の扱い</label>
      <select id="quoteMode">
        <option value="bouten">傍点で強調（引用符は消す）</option>
        <option value="nonokagi">〝ノノカギ〟に変換</option>
        <option value="both">〝ノノカギ〟＋傍点</option>
        <option value="none">そのまま</option>
      </select>
      <label class="check"><input type="checkbox" id="optChapter" checked> 章見出しで改ページ</label>
      <label class="check"><input type="checkbox" id="optHashira" checked> 柱（章題）を入れる</label>
      <label class="check"><input type="checkbox" id="optOkuduke" checked> 奥付を入れる</label>
      <label class="check"><input type="checkbox" id="optPublisher" checked> 奥付に「発行」（レーベル名）を入れる</label>
      <label class="check"><input type="checkbox" id="optSig"> 16ページ単位（折）に白ページで揃える</label>
    </details>

    <div class="btns">
      <button class="primary" id="btnBuild">組版する</button>
      <button id="btnPrint">PDFで保存</button>
      <button id="btnReader">閲覧モード</button>
    </div>
    <div class="stats" id="stats">—</div>

  </aside>

  <main class="main">
    <div class="toolbar">
      <button id="next" aria-label="次へ（左）">◀ 次</button>
      <span class="pos" id="pos"></span>
      <button id="prev" aria-label="前へ（右）">前 ▶</button>
      <select id="view" aria-label="表示">
        <option value="spread">見開き</option>
        <option value="single">単ページ</option>
      </select>
      <button id="btnEdit" class="reader-only" hidden>編集に戻る</button>
    </div>
    <div class="stage" id="stage"></div>
  </main>
</div>

<div id="measure"></div>
<div id="print-root"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const MM = 96/25.4;
const STORE = "bunko-sim-v1";

const SAMPLE = `# 第一章　星を拾う少女
　その夜、空から星が一つ落ちてきた。
　正確に言えば、落ちてきたのは星の欠片《かけら》で、拾ったのは僕ではなく隣の家の｜天音《あまね》だった。
「ねえ、これ、まだ温かいよ」
　両手で包むように差し出されたそれは、硝子《がらす》玉ほどの大きさで、心臓みたいにゆっくりと明滅していた。
　僕は十七歳で、彼女は十六歳で、その夏は例年より少しだけ長かった。
「警察に届けたほうがいいんじゃないか」
「星って遺失物なの？」
「……知らないけど」
　天音は笑った。笑うと目尻が下がって、昔と何ひとつ変わらない顔になる。
　欠片はその晩から、彼女の机の上の小さな瓶に住むことになった。瓶のラベルには、彼女の丸い字で《《ほし》》とだけ書かれていた。
　僕たちはそれが何なのかを、まだ何も知らなかった。知らないまま、夏休みは始まった。

　翌朝、町の空は奇妙に澄んでいた。
　雲ひとつない、というのとは少し違う。空そのものが一枚薄くなったような、向こう側が透けて見えそうな青だった。
　駅前の電光掲示板は、朝から同じ文字を流し続けていた。
――観測史上初の現象について、気象庁は十時より会見を行う予定です。
「ねえ、見て」
　天音が瓶を持ち上げる。欠片は昨夜よりもはっきりと、規則正しく光っていた。
　まるで、誰かに呼ばれて返事をしているみたいに。

［改ページ］
# 第二章　透明な午後
　会見は十二時を過ぎても始まらなかった。
　テレビの中の記者たちは、何を質問すればいいのかわからないという顔で、空ばかりを見上げていた。
　僕と天音は、商店街の端にある古い喫茶店の窓際で、溶けかけたクリームソーダを挟んで座っていた。
「あのさ」
「うん」
「もしこれが本物の星だったら、どうする？」
　天音はストローをくわえたまま首を傾げた。
「返しに行く」
「どこに」
「空に決まってるでしょ」
　当たり前のことを聞くな、という顔だった。僕はそれ以上何も言えなくなって、グラスの底に沈んだ赤いさくらんぼを眺めた。`;

const DEF = {
  title:"星を拾う少女", author:"CryStar", label:"CryStar文庫",
  text:SAMPLE, chars:42, lines:17, mTop:14, mBottom:12, mGutter:14, mFore:10,
  font:"Noto Serif JP", preset:"42,17",
  optCover:true, coverColor:"#35507a", coverOn:"#ffffff", coverBand:"夏休み、僕たちは星を空に返しに行く。",
  images:{}, coverImg:"", kuchie:"", optCoverText:true, optBand:true, optPublisher:true,
  quoteMode:"bouten",
  optTobira:true, optChapter:true, optHashira:true, optOkuduke:true, optSig:false,
  view:"spread"
};
const FIELDS = Object.keys(DEF).filter(k=>k!=="view");

let cfg = {};
try { cfg = JSON.parse($("book-config").textContent || "{}"); } catch(e){ cfg = {}; }
const READER = cfg.mode === "reader";
let S = {...DEF};
if (!READER) { try { const s = localStorage.getItem(STORE); if (s) S = {...S, ...JSON.parse(s)}; } catch(e){} }
S = {...S, ...cfg};
const ms = ($("manuscript").textContent || "").replace(/^\n+|\s+$/g,"");
if (ms) S.text = ms;
delete S.mode;

// ---------- UI binding ----------
function toUI(){
  for (const k of FIELDS){ const el=$(k); if(!el) continue;
    if (el.type==="checkbox") el.checked=!!S[k]; else el.value=S[k]; }
  $("view").value = S.view;
}
function fromUI(){
  for (const k of FIELDS){ const el=$(k); if(!el) continue;
    if (el.type==="checkbox") S[k]=el.checked;
    else if (el.type==="number") S[k]=parseFloat(el.value)||DEF[k];
    else S[k]=el.value; }
  S.view=$("view").value;
}
function save(){ if (READER) return true; try{ localStorage.setItem(STORE, JSON.stringify(S)); return true; }catch(e){ return false; } }

// ---------- 原稿パース ----------
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RE = /《《(.+?)》》|[|｜]([^|｜《\n]+?)《(.+?)》|([\u4E00-\u9FFF\u3400-\u4DBF々〆ヶ]+)《(.+?)》|(?<![0-9０-９])([0-9]{2})(?![0-9])|([!?！？]{2})(?![!?！？])|["“]([^"”\n]+?)["”]/g;
function tokenize(line){
  const out=[]; let last=0; const re=new RegExp(RE.source,"g"); let m;
  const plain = s => { for (const ch of s) out.push(esc(ch)); };
  while ((m=re.exec(line))){
    plain(line.slice(last,m.index));
    if (m[1]!==undefined) for (const ch of m[1]) out.push(`<span class="bt">${esc(ch)}</span>`);
    else if (m[2]!==undefined) out.push(`<ruby>${esc(m[2])}<rt>${esc(m[3])}</rt></ruby>`);
    else if (m[4]!==undefined) out.push(`<ruby>${esc(m[4])}<rt>${esc(m[5])}</rt></ruby>`);
    else if (m[6]!==undefined) out.push(`<span class="tcy">${m[6]}</span>`);
    else if (m[7]!==undefined) out.push(`<span class="tcy">${esc(m[7].replace(/！/g,"!").replace(/？/g,"?"))}</span>`);
    else if (m[8]!==undefined){
      const inner = tokenize(m[8]);
      const q = S.quoteMode;
      const body = (q==="bouten"||q==="both") ? inner.map(t=>`<span class="bt">${t}</span>`) : inner;
      if (q==="none") out.push("&quot;", ...inner, "&quot;");
      else if (q==="bouten") out.push(...body);
      else out.push("〝", ...body, "〟");
    }
    last = re.lastIndex;
  }
  plain(line.slice(last));
  return out;
}
function parse(text){
  const blocks=[];
  const lines = text.replace(/\r/g,"").split("\n");
  for (const raw of lines){
    const line = raw.replace(/\s+$/,"");
    if (/^[#＃]\s*/.test(line) && line.replace(/^[#＃]\s*/,"")) blocks.push({t:"h", text:line.replace(/^[#＃]\s*/,"")});
    else if (/^(\[newpage\]|［改ページ］|\[改ページ\])$/.test(line.trim())) blocks.push({t:"br"});
    else if (/^[［\[](?:挿絵|illust)[：:]\s*(.+?)[］\]]$/.test(line.trim())) blocks.push({t:"img", name:line.trim().match(/^[［\[](?:挿絵|illust)[：:]\s*(.+?)[］\]]$/)[1]});
    else if (line==="") blocks.push({t:"p", tok:[]});
    else blocks.push({t:"p", tok:tokenize(line)});
  }
  return blocks;
}

// ---------- 組版 ----------
function geom(){
  const fs = (148 - S.mTop - S.mBottom) / S.chars;          // mm
  const blockW = 105 - S.mGutter - S.mFore;
  const pitch = blockW / S.lines;
  return {fs, pitch, lh: pitch/fs, blockW, blockH: fs*S.chars};
}
function bodyStyle(g, odd){
  // 右綴じ：奇数ページ＝左ページ（ノドが右）
  const right = odd ? S.mGutter : S.mFore, left = odd ? S.mFore : S.mGutter;
  return `top:${S.mTop}mm;right:${right}mm;width:${g.blockW}mm;height:${(g.blockH+0.05).toFixed(3)}mm;left:${left}mm;font-size:${g.fs.toFixed(4)}mm;line-height:${g.lh.toFixed(4)}`;
}
function pHTML(tok){ return tok.length ? `<p>${tok.join("")}</p>` : `<p>　</p>`; }
function hHTML(text){ return `<h2 style="margin-block:0 ${ (1).toFixed(2) }em;padding-block-start:2em;padding-inline-start:3em">${tokenize(text).join("")}</h2>`; }

let pages = [];     // {kind, html, chapter, num}
let spreads = [];
let cur = 0;

async function build(){
  fromUI(); save();
  $("book-font").href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(S.font).replace(/%20/g,"+")}:wght@400;700&display=swap`;
  document.documentElement.style.setProperty("--bf", `"${S.font}"`);
  try { await document.fonts.load(`16px "${S.font}"`, "漢あア"); await document.fonts.ready; } catch(e){}

  const g = geom();
  const meas = $("measure");
  meas.innerHTML = `<div class="page"><div class="body" style="${bodyStyle(g,true)}"></div></div>`;
  const body = meas.querySelector(".body");
  const fits = () => { const br = body.getBoundingClientRect(); const lc = body.lastElementChild; if(!lc) return true;
    return lc.getBoundingClientRect().left >= br.left - 0.5; };

  const blocks = parse(S.text);
  const bodyPages = []; let curHtml = []; let chapter = ""; let pageChapter = "";
  const flush = () => { bodyPages.push({html:curHtml.join(""), chapter:pageChapter||chapter}); curHtml=[]; body.innerHTML=""; pageChapter=""; };

  for (const b of blocks){
    if (b.t==="br"){ if (curHtml.length) flush(); continue; }
    if (b.t==="img"){ if (curHtml.length) flush(); bodyPages.push({kind:"illust", name:b.name, chapter}); continue; }
    if (b.t==="h"){
      chapter = b.text;
      if (S.optChapter && curHtml.length) flush();
      const h = hHTML(b.text);
      body.insertAdjacentHTML("beforeend", h);
      if (!fits() && curHtml.length){ body.lastElementChild.remove(); flush(); body.insertAdjacentHTML("beforeend", h); }
      curHtml.push(h); if(!pageChapter) pageChapter = chapter; continue;
    }
    let tok = b.tok;
    while (true){
      const html = pHTML(tok);
      body.insertAdjacentHTML("beforeend", html);
      if (fits()){ curHtml.push(html); break; }
      body.lastElementChild.remove();
      // 二分探索で入る分だけ
      let lo=0, hi=tok.length;
      while (lo<hi){ const mid=Math.ceil((lo+hi)/2);
        body.insertAdjacentHTML("beforeend", `<p>${tok.slice(0,mid).join("")}</p>`);
        const ok = fits(); body.lastElementChild.remove();
        if (ok) lo=mid; else hi=mid-1; }
      if (lo===0){ if (!curHtml.length){ curHtml.push(html); break; } flush(); continue; }
      curHtml.push(`<p>${tok.slice(0,lo).join("")}</p>`); flush();
      tok = tok.slice(lo);
    }
  }
  if (curHtml.length) flush();

  // ページ列を組み立て（ノンブルは扉から通しで数える＝一般的な文庫の数え方）
  pages = [];
  if (S.optCover) pages.push({kind:"cover"});
  for (const k of (S.kuchie||"").split(/[,、，\s]+/).filter(Boolean)) pages.push({kind:"kuchie", name:k});
  let n = 0;
  if (S.optTobira){ pages.push({kind:"tobira", num:++n}); pages.push({kind:"blank", num:++n}); }
  for (const bp of bodyPages) pages.push({kind:bp.kind||"body", name:bp.name, html:bp.html, chapter:bp.chapter, num:++n});
  if (S.optSig || S.optOkuduke){
    let total = n + (S.optOkuduke?1:0);
    if (S.optSig){ const pad = (16 - total%16)%16; for(let i=0;i<pad;i++) pages.push({kind:"blank", num:++n}); }
    else if (S.optOkuduke && (n+1)%2===1){ pages.push({kind:"blank", num:++n}); } // 奥付は偶数（右）ページへ
  }
  if (S.optOkuduke) pages.push({kind:"okuduke", num:++n});
  // ページのHTML化
  for (const p of pages){ p.el = renderPage(p, g); if (p.kind==="cover"||p.kind==="tobira") fitText(p.el); }

  makeSpreads();
  cur = Math.min(cur, spreads.length-1);
  show();
  const bodyCount = bodyPages.length;
  const chars = S.text.replace(/《.*?》|[|｜#＃\s]/g,"").length;
  $("stats").innerHTML = `総ページ <b>${n}</b>P（本文 ${bodyCount}P）${S.optCover?"＋表紙":""}<br>
    文字数 約${chars.toLocaleString()}字 ／ 1頁 ${S.chars*S.lines}字<br>
    ${n%16 ? `折（16P）まであと ${16-n%16}P` : "16Pの折にぴったりです"}`;
  $("spec").textContent = `本文 約${(g.fs/0.3528).toFixed(1)}pt・行送り${g.pitch.toFixed(2)}mm（行間${Math.round((g.lh-1)*100)}%）・版面${g.blockH.toFixed(1)}×${g.blockW.toFixed(1)}mm`;
  // 印刷用
  const pr = $("print-root"); pr.innerHTML="";
  for (const p of pages) pr.appendChild(p.el.cloneNode(true));
}

// タイトル中の「｜」で任意改行（長いタイトルを2行に組む用）
function titleHTML(){ return S.title.split(/[｜|]/).map(esc).join("<br>"); }
// 表紙・扉の文字が1行に収まらないとき、収まるまで縮小
function fitText(el){
  const meas = $("measure"); meas.innerHTML = ""; meas.appendChild(el);
  el.querySelectorAll("[data-avail]").forEach(t=>{
    const av = parseFloat(t.dataset.avail) * MM, h = t.getBoundingClientRect().height;
    if (h > av){ const fs = parseFloat(getComputedStyle(t).fontSize); t.style.fontSize = (fs * av / h * 0.99) + "px"; }
  });
  meas.removeChild(el);
}
function renderPage(p, g){
  const d = document.createElement("div"); d.className="page";
  const odd = p.num % 2 === 1;
  const imgOf = name => { const src = S.images[name];
    return src ? `<img class="full" src="${esc(src)}" alt="">` : `<div class="missing">画像「${esc(name)}」が<br>登録されていません</div>`; };
  if (p.kind==="cover"){
    d.style.background = S.coverColor; d.style.color = S.coverOn;
    const has = S.coverImg && S.images[S.coverImg];
    const bandOn = S.optBand && S.coverBand;
    d.innerHTML = `<div class="cover${has?" hasimg":""}">${has?imgOf(S.coverImg):""}
      ${S.optCoverText?`<div class="t" data-avail="${148-14-(bandOn?44:12)}">${titleHTML()}</div><div class="a" style="bottom:${bandOn?44:12}mm" data-avail="${148-(bandOn?44:12)-60}">${esc(S.author)}</div>`:""}
      ${S.optBand && S.coverBand?`<div class="band">${esc(S.coverBand)}</div>`:""}</div>`;
    return d;
  }
  if (p.kind==="kuchie" || p.kind==="illust"){ d.innerHTML = imgOf(p.name); return d; }
  if (p.kind==="tobira"){
    d.innerHTML = `<div class="tobira"><div class="t" style="right:${odd?S.mGutter+14:S.mFore+14}mm;top:26mm;font-size:17pt" data-avail="100">${titleHTML()}</div>
      <div class="a" style="right:${odd?S.mGutter+30:S.mFore+30}mm;top:70mm;font-size:9pt" data-avail="56">${esc(S.author)}</div></div>`;
    return d; // 隠しノンブル
  }
  if (p.kind==="blank") return d;
  if (p.kind==="okuduke"){
    const dt = new Date(); const ds = `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
    d.innerHTML = `<div class="okuduke"><div class="box"><div class="bt2">${esc(S.title)}</div>
      ${ds}　初版発行<br>著者　${esc(S.author)}<br>${S.optPublisher?`発行　${esc(S.label)}<br>`:""}<br>本書は個人制作による作品です。無断転載を禁じます。</div></div>`;
    return d;
  }
  // 本文
  const outer = odd ? "left" : "right";
  const bottom = Math.max(4, S.mBottom*0.45);
  d.innerHTML = `<div class="body" style="${bodyStyle(g,odd)}">${p.html}</div>
    <div class="nombre" style="${outer}:${(odd?S.mFore:S.mFore)*0.9}mm;bottom:${bottom}mm">${p.num}</div>
    ${S.optHashira && p.chapter && odd ? `<div class="hashira" style="left:${S.mFore*0.9+7}mm;bottom:${bottom}mm">${esc(p.chapter)}</div>`:""}`;
  return d;
}

// ---------- 表示 ----------
function makeSpreads(){
  spreads = [];
  const single = S.view==="single";
  let i = 0;
  if (pages[0] && pages[0].kind==="cover"){ spreads.push([pages[0]]); i=1; }
  const kc=[]; while (pages[i] && pages[i].kind==="kuchie") kc.push(pages[i++]);
  const rest = pages.slice(i);
  if (single){ kc.forEach(p=>spreads.push([p])); rest.forEach(p=>spreads.push([p])); return; }
  for (let j=0;j<kc.length;j+=2) spreads.push([kc[j], kc[j+1]||null]);
  // 右綴じ：1ページ目は左ページ単独 → [右:null, 左:p1]
  let k=0;
  if (rest[0] && rest[0].num%2===1){ spreads.push([null, rest[0]]); k=1; }
  for (; k<rest.length; k+=2) spreads.push([rest[k], rest[k+1]||null]); // [右(偶数), 左(奇数)]
}
function show(){
  const st = $("stage"); st.innerHTML="";
  if (!spreads.length) return;
  const sp = spreads[cur];
  const isSingle = sp.length===1;
  const wrap = document.createElement("div");
  const spread = document.createElement("div"); spread.className = "spread"+(isSingle?" single":"");
  for (const p of sp){ const s=document.createElement("div"); s.className="slot"+(p?"":" empty");
    if (p) s.appendChild(p.el.cloneNode(true)); spread.appendChild(s); }
  const tl=document.createElement("div"); tl.className="tap l"; tl.onclick=()=>go(1);
  const tr=document.createElement("div"); tr.className="tap r"; tr.onclick=()=>go(-1);
  spread.append(tl,tr);
  const scaler=document.createElement("div"); scaler.className="scaler"; scaler.appendChild(spread);
  wrap.appendChild(scaler); st.appendChild(wrap);
  const wmm = 105*sp.length, hmm=148;
  const r = st.getBoundingClientRect();
  const sc = Math.max(0.2, Math.min((r.height-24)/(hmm*MM), (r.width-24)/(wmm*MM)));
  scaler.style.transform = `scale(${sc})`;
  wrap.style.width = `${wmm*MM*sc}px`; wrap.style.height = `${hmm*MM*sc}px`;
  const nums = sp.filter(Boolean).map(p=>p.kind==="cover"?"表紙":p.kind==="kuchie"?"口絵":p.num);
  $("pos").textContent = `${nums.join("–")}　（${cur+1}/${spreads.length}）`;
}
function go(d){ const n = cur+d; if (n<0||n>=spreads.length) return; cur=n; show(); }

// ---------- イベント ----------
$("next").onclick=()=>go(1); $("prev").onclick=()=>go(-1);
document.addEventListener("keydown", e=>{
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key==="ArrowLeft"||e.key===" ") { e.preventDefault(); go(1); }
  if (e.key==="ArrowRight") go(-1);
});
let sx=null; const stg=$("stage");
stg.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
stg.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx;
  if (Math.abs(dx)>40) go(dx>0?1:-1); sx=null; });
$("view").onchange=()=>{ S.view=$("view").value; save(); makeSpreads(); cur=0; show(); };
$("preset").onchange=()=>{ const v=$("preset").value; if(v==="custom") return;
  const [c,l]=v.split(",").map(Number); $("chars").value=c; $("lines").value=l; build(); };
["chars","lines"].forEach(id=>$(id).addEventListener("input",()=>{$("preset").value="custom";}));
$("btnBuild").onclick=build;
["coverImg","kuchie","optCoverText","optBand","optPublisher","font","quoteMode","optCover","optTobira","optChapter","optHashira","optOkuduke","optSig","mTop","mBottom","mGutter","mFore"]
  .forEach(id=>$(id).addEventListener("change",build));
let tmr; $("text").addEventListener("input",()=>{ clearTimeout(tmr); tmr=setTimeout(build,900); });
$("btnPrint").onclick=async()=>{ await build(); window.print(); };
$("btnReader").onclick=()=>{ document.body.classList.add("reader"); $("btnEdit").hidden=false; requestAnimationFrame(show); };
$("btnEdit").onclick=()=>{ document.body.classList.remove("reader"); $("btnEdit").hidden=true; requestAnimationFrame(show); };
let rt; window.addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(show,120);});

function refreshImgUI(){
  const names = Object.keys(S.images||{});
  $("imgList").innerHTML = names.map(n=>`<div class="it"><img src="${esc(S.images[n])}" alt=""><button data-del="${esc(n)}" aria-label="${esc(n)}を削除">×</button>${esc(n)}</div>`).join("");
  $("coverImg").innerHTML = `<option value="">なし（単色）</option>` + names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  $("coverImg").value = names.includes(S.coverImg) ? S.coverImg : "";
}
async function shrink(f){
  const url = URL.createObjectURL(f); const im = new Image();
  await new Promise((r,j)=>{ im.onload=r; im.onerror=j; im.src=url; });
  const k = Math.min(1, 1800/Math.max(im.width, im.height));
  const c = document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg", 0.88);
}
$("imgFile").onchange = async e => {
  fromUI();
  for (const f of e.target.files){ try{ S.images[f.name.replace(/\.[^.]+$/,"")] = await shrink(f); }catch(err){} }
  e.target.value=""; refreshImgUI();
  $("imgNote").textContent = save() ? "" : "画像の合計が大きく、ブラウザに保存できませんでした。この画面を開いている間は使えます。";
  build();
};
$("imgList").onclick = e => { const n = e.target.dataset && e.target.dataset.del; if (!n) return;
  fromUI(); delete S.images[n]; if (S.coverImg===n) S.coverImg=""; refreshImgUI(); if (save()) $("imgNote").textContent=""; build(); };

if (READER){ document.body.classList.add("reader"); }
S.images = {...(S.images||{})};
refreshImgUI(); toUI(); build();
})();
</script>
</body>
